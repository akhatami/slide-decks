<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Five Dials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;700&family=Unbounded:wght@500;800&display=swap">
<style>
/* layout: one 1600x900 stage scaled to the screen, with a living particle field behind it */
:root{
  --bg:#04070D; --bg2:#0A1220; --panel:#0D1826; --line:#1D2D42;
  --fg:#EAF3FA; --mute:#8598AE; --dim:#4B5E75;
  --acc:#19C8F5; --acc-ink:#03202B; --hot:#FF8A5B;
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-b:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
:root[data-room="bright"]{
  --bg:#F2F6FA; --bg2:#E4ECF4; --panel:#FFFFFF; --line:#C6D3E0;
  --fg:#06121E; --mute:#4A5C71; --dim:#8395A9;
  --acc:#007BA8; --acc-ink:#FFFFFF; --hot:#CF4519;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

/* ---------- deck ---------- */
body.is-deck{overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
#deck{position:fixed;inset:0;overflow:hidden;user-select:none;cursor:default}
#deck::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 25%,color-mix(in srgb,var(--bg) 82%,transparent) 100%)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1))}

.slide{position:absolute;inset:0;padding:78px 110px 170px;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(.7);filter:blur(16px);
  transition:opacity .5s ease,transform .85s var(--ease),filter .5s ease,visibility 0s .85s}
.slide.past{transform:scale(1.85)}
.slide.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;
  transition:opacity .55s ease .14s,transform .9s var(--ease) .06s,filter .55s ease .14s,visibility 0s}

.rise{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .8s var(--ease)}
.slide.on .rise{opacity:1;transform:none;transition-delay:calc(var(--i,0)*90ms + .32s)}
.w{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(.28em);transition:opacity .5s ease,filter .5s ease,transform .7s var(--ease)}
.slide.on .w{opacity:1;filter:none;transform:none;transition-delay:calc(var(--i,0)*38ms + .3s)}
.hl{color:var(--acc)}

.kick{font:600 20px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:14px;min-height:20px}
.kick::before{content:"";width:12px;height:12px;background:var(--acc);flex:none}
.kick.hot{color:var(--hot)} .kick.hot::before{background:var(--hot)}
.big{font:800 108px/1 var(--f-d);letter-spacing:-.025em;margin:0;text-wrap:balance}
.say{font:500 60px/1.14 var(--f-d);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{font:400 32px/1.35 var(--f-b);color:var(--mute);margin:0;max-width:1050px}
.mono{font:400 20px/1.4 var(--f-m);color:var(--mute);letter-spacing:.04em}

/* title + statements */
.s-title{justify-content:center;gap:38px}
.s-title .keys{position:absolute;left:110px;bottom:118px}
.s-hands,.s-final{justify-content:center;gap:40px}
.s-hands .say{font-size:76px;max-width:1280px}
.s-final .big{font-size:104px}
.eq{display:flex;gap:10px;align-items:flex-end;height:70px}
.eq i{width:14px;background:var(--acc);height:20%;animation:eq 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.19s);opacity:.85}
@keyframes eq{0%,100%{height:18%}50%{height:100%}}

/* chapter */
.s-chapter{align-items:center;justify-content:flex-start;text-align:center}
.s-chapter .kick{margin-top:92px}
.word{position:absolute;left:0;right:0;top:290px;height:260px;line-height:260px;text-align:center;font-family:var(--f-d);font-weight:800;letter-spacing:-.01em;
  color:color-mix(in srgb,var(--acc) 13%,transparent);text-shadow:0 0 60px color-mix(in srgb,var(--acc) 40%,transparent);opacity:0;transition:opacity 1.1s ease .9s}
.slide.on .word{opacity:1}
.s-chapter .sub{position:absolute;left:0;right:0;top:600px;max-width:none;font-size:36px;color:var(--fg)}

/* poll */
.s-poll{gap:30px}
.s-poll .say{max-width:940px;font-size:58px}
.s-poll .opts{display:flex;flex-direction:column;gap:9px;margin:2px 0 0;padding:0;list-style:none;max-width:900px}
.s-poll .opts li{font:400 25px/1.3 var(--f-b);color:var(--mute);display:flex;gap:12px}
.s-poll .opts li::before{content:"";width:8px;height:8px;border:2px solid var(--dim);margin-top:11px;flex:none}
.count{position:absolute;left:110px;bottom:150px;display:flex;align-items:baseline;gap:22px}
.count b{font:800 132px/.9 var(--f-d);color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:-.03em;min-width:1ch}
.count span{font:400 26px/1.2 var(--f-m);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.count b.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:scale(1.22);color:var(--hot)}100%{transform:none}}

/* results */
.s-results{gap:22px}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.rhead h2{font:500 36px/1.15 var(--f-d);letter-spacing:-.015em;margin:14px 0 0;max-width:1080px;text-wrap:balance}
.rhead .n{font:600 22px/1 var(--f-m);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding-bottom:6px}
.rhead .n b{color:var(--fg);font-size:34px;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:14px;margin-top:14px;flex:1;justify-content:center;padding-right:170px}
.bar{display:grid;grid-template-columns:470px minmax(0,1fr) 120px 64px;align-items:center;gap:22px}
.bar .l{font:500 28px/1.15 var(--f-b);color:var(--fg);text-align:right}
.bar .t{height:38px;background:color-mix(in srgb,var(--line) 70%,transparent);position:relative;overflow:hidden}
.bar .t i{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(var(--v,0));transition:transform 1s var(--ease);opacity:.55}
.bar .p{font:800 36px/1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar .c{font:400 20px/1 var(--f-m);color:var(--mute);font-variant-numeric:tabular-nums}
.bar.lead .t i{opacity:1;box-shadow:0 0 34px color-mix(in srgb,var(--acc) 70%,transparent)}
.bar.lead .p{color:var(--acc)}
.slide:not(.on) .bar .t i{transform:scaleX(0)}
.cloud{position:relative;flex:1;margin:6px 150px 0 0}
.cloud span{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--f-b);font-weight:700;line-height:1.18;color:var(--fg);
  transition:transform 1s var(--ease),font-size .6s var(--ease),opacity .6s ease,color 1.6s ease;cursor:pointer}
.cloud span.top{color:var(--acc)}
.cloud span.one{color:color-mix(in srgb,var(--fg) 74%,transparent)}
.cloud span.new{color:var(--hot);transition:transform 1s var(--ease),font-size .6s var(--ease),opacity .6s ease,color 0s}
.cloud span.in{opacity:0}
.empty{position:absolute;left:110px;right:110px;top:46%;text-align:center;font:400 26px/1.4 var(--f-m);color:var(--dim);letter-spacing:.06em}
.more{position:absolute;right:270px;bottom:118px;font:400 18px/1 var(--f-m);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

/* story */
.s-story{justify-content:center;gap:34px;padding-left:330px}
.ring{position:absolute;left:120px;top:50%;width:150px;height:150px;margin-top:-110px;border-radius:50%;border:3px solid var(--hot)}
.ring::before,.ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--hot);animation:ring 2.4s ease-out infinite}
.ring::after{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.1);opacity:0}}
.s-story .say{max-width:1080px;font-size:62px}

/* insight */
.s-insight{justify-content:center;gap:44px}
.s-insight .say{font-size:62px;max-width:1340px}
.dia{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:color-mix(in srgb,var(--panel) 82%,transparent);padding:18px 26px;display:flex;flex-direction:column;gap:8px;min-width:230px}
.chip b{font:500 26px/1.15 var(--f-d);letter-spacing:-.01em}
.chip small{font:400 19px/1.2 var(--f-m);color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.chip.far{border-color:var(--acc)} .chip.far small{color:var(--acc)}
.arrow{align-self:center;font:400 30px/1 var(--f-m);color:var(--dim)}

/* try */
.s-try{justify-content:center;gap:26px}
.s-try .say{font-size:56px}
.term{background:color-mix(in srgb,var(--panel) 90%,transparent);border:2px solid var(--line);padding:30px 36px;max-width:1280px;display:flex;flex-direction:column;gap:18px;margin-top:8px}
.term::before{content:"prompt";font:600 16px/1 var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.term p{margin:0;font:400 33px/1.35 var(--f-m);color:var(--fg);padding-left:44px;position:relative}
.term p::before{content:">";position:absolute;left:0;color:var(--acc);font-weight:600}
.term .rest{color:transparent}
.term .caret{display:inline-block;width:.55em;height:1.05em;background:var(--acc);vertical-align:-.16em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.note{font:400 26px/1.4 var(--f-b);color:var(--mute);max-width:1100px;border-left:3px solid var(--hot);padding-left:20px}

/* recap */
.s-recap{gap:20px}
.s-recap{gap:14px}
.s-recap h2{font:500 40px/1.1 var(--f-d);letter-spacing:-.02em;margin:8px 0 4px}
.recap{display:flex;flex-direction:column;gap:6px;padding-right:160px}
.recap{border-top:2px solid var(--line)}
.rrow{display:grid;grid-template-columns:330px minmax(0,1fr) 190px;gap:28px;align-items:baseline;padding:10px 0 11px;border-bottom:2px solid var(--line);position:relative}
.rrow .d{font:800 26px/1 var(--f-d);color:var(--acc)}
.rrow .a{font:500 29px/1.2 var(--f-b)}
.rrow .a small{display:block;font:400 17px/1.3 var(--f-m);color:var(--mute);letter-spacing:.04em;margin-top:2px}
.rrow .v{font:800 38px/1 var(--f-d);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rrow::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:calc(var(--v,0)*100%);background:var(--acc);transition:width 1.2s var(--ease) .5s}
.slide:not(.on) .rrow::after{width:0}
.xtab{font:400 24px/1.4 var(--f-b);color:var(--mute);border-left:3px solid var(--hot);padding-left:20px;margin:12px 0 0;max-width:1150px}
.xtab b{color:var(--fg)}

/* hud */
#hud{position:absolute;left:110px;right:110px;bottom:44px;height:64px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;transition:opacity .6s}
.hl-l{display:flex;align-items:center;gap:18px}
.knob{width:64px;height:64px;flex:none}
.knob .needle{transform-origin:32px 32px;transform:rotate(var(--ang,-165deg));transition:transform 1.1s var(--ease)}
.knob circle.dot{fill:var(--dim);transition:fill .5s}
.knob circle.dot.lit{fill:var(--acc)}
#hudDial{font:600 18px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hl-r{display:flex;align-items:center;gap:26px;margin-right:158px;font:400 18px/1 var(--f-m);letter-spacing:.08em;color:var(--mute);text-transform:uppercase;font-variant-numeric:tabular-nums;transition:margin .9s var(--ease)}
#deck[data-qr="off"] .hl-r,#deck[data-qr="side"] .hl-r{margin-right:0}
.dot-s{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--dim);margin-right:10px;vertical-align:1px}
.dot-s.ok{background:var(--acc);box-shadow:0 0 12px var(--acc)}
#hudTime.over{color:var(--hot)}
#hudDemo{color:var(--hot);font-weight:600}
#hudHint{color:var(--dim)}

/* qr */
#qr{position:absolute;right:110px;bottom:40px;width:136px;height:136px;background:#F4FAFF;padding:9px;z-index:5;
  transition:right .9s var(--ease),bottom .9s var(--ease),width .9s var(--ease),height .9s var(--ease),opacity .5s ease,padding .9s var(--ease),box-shadow .9s}
#qr svg{display:block;width:100%;height:100%}
#qr .cap{position:absolute;left:0;right:0;top:100%;padding-top:16px;text-align:center;font:600 20px/1.35 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);opacity:0;transition:opacity .4s}
#qr .cap small{display:block;color:var(--mute);font-weight:400;letter-spacing:.04em;text-transform:none;font-size:18px;margin-top:4px}
#qr .cap .warn{color:var(--hot)}
#deck[data-qr="off"] #qr{opacity:0;pointer-events:none}
#deck[data-qr="side"] #qr{right:110px;bottom:372px;width:400px;height:400px;padding:22px;box-shadow:0 0 90px color-mix(in srgb,var(--acc) 34%,transparent)}
#deck[data-qr="side"] #qr .cap{opacity:1;transition-delay:.6s}
#deck.hero #qr{right:500px;bottom:230px;width:600px;height:600px;padding:32px;opacity:1;pointer-events:auto;box-shadow:0 0 0 2000px color-mix(in srgb,var(--bg) 90%,transparent)}
#deck.hero #qr .cap{opacity:1}

/* panel */
#panel{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);overflow:auto;padding:28px clamp(16px,4vw,56px) 60px;user-select:text;cursor:auto}
.pn{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.pn-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.pn-h h1{font:500 26px/1.1 var(--f-d);margin:0;letter-spacing:-.01em}
.pn h2{font:600 14px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 12px}
.btn{border:1.5px solid var(--line);background:var(--panel);padding:9px 16px;font:500 15px/1.2 var(--f-b);border-radius:2px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.warn{border-color:var(--hot);color:var(--hot)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{border:1.5px solid var(--line);background:var(--panel);padding:16px 18px}
.tile b{display:block;font:800 34px/1 var(--f-d);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile span{font:400 13px/1.3 var(--f-m);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{border:1.5px solid var(--line);background:var(--panel);padding:18px 20px;min-width:0}
.card h3{font:700 17px/1.3 var(--f-b);margin:0 0 4px}
.card .meta{font:400 13px/1.3 var(--f-m);color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.mb{display:grid;grid-template-columns:minmax(0,1fr) 90px 74px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.mb .t{grid-column:1/-1;height:5px;background:var(--line);position:relative}
.mb .t i{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(var(--v,0))}
.mb .p{text-align:right;font:600 14px/1 var(--f-m);font-variant-numeric:tabular-nums}
.mb .c{text-align:right;font:400 13px/1 var(--f-m);color:var(--mute);font-variant-numeric:tabular-nums}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words button{border:1.5px solid var(--line);background:transparent;padding:4px 9px;font-size:14px;border-radius:2px}
.words button.off{text-decoration:line-through;color:var(--dim)}
.words button b{font:600 12px/1 var(--f-m);color:var(--acc);margin-left:6px}
table.x{border-collapse:collapse;font-size:14px;width:100%}
table.x th,table.x td{border:1px solid var(--line);padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
table.x th{font-weight:500;color:var(--mute);text-align:left}
table.x td.z{color:var(--dim)}
.xwrap{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:min(100%,280px)}
.field label{font:400 13px/1.3 var(--f-m);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.field input,.pn select{background:var(--bg);border:1.5px solid var(--line);padding:9px 12px;border-radius:2px;min-width:0;width:100%}
.pn select{width:auto;max-width:100%}
.help{font-size:14px;color:var(--mute);margin:0;max-width:78ch}
.help code,pre.code{font-family:var(--f-m);font-size:13px;color:var(--fg)}
pre.code{background:var(--bg);border:1.5px solid var(--line);padding:10px 12px;margin:8px 0 0;overflow-x:auto;user-select:all}
.link{font:400 14px/1.4 var(--f-m);word-break:break-all;color:var(--fg);user-select:all}
.keysl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;font-size:14px;color:var(--mute)}
kbd{font:600 13px/1 var(--f-m);border:1.5px solid var(--line);padding:3px 7px;color:var(--fg);margin-right:8px;border-radius:2px}

/* ---------- phone ---------- */
body.is-phone{overflow-x:hidden;overflow-y:auto;background:
  linear-gradient(color-mix(in srgb,var(--acc) 7%,transparent) 1px,transparent 1px) 0 0/100% 44px,
  linear-gradient(90deg,color-mix(in srgb,var(--acc) 7%,transparent) 1px,transparent 1px) 0 0/44px 100%,
  radial-gradient(ellipse 120% 60% at 50% 0%,color-mix(in srgb,var(--acc) 16%,var(--bg)),var(--bg) 70%) fixed}
#phone{min-height:100%;max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.ph-top{display:flex;justify-content:space-between;align-items:center}
.ph-brand{font:800 15px/1 var(--f-d);letter-spacing:.02em}
.ph-live{font:600 12px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.ph-live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:8px;animation:blink 1.4s steps(2) infinite}
.ph-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ph-steps button{height:40px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);font:600 14px/1 var(--f-m);color:var(--mute);border-radius:2px;padding:0}
.ph-steps button.done{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}
.ph-steps button.cur{border-color:var(--fg);color:var(--fg)}
.ph-steps button.done.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.ph-card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1.5px solid var(--line);padding:22px 18px 20px;display:flex;flex-direction:column;gap:16px;animation:pin .5s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(16px) scale(.98)}}
.ph-card .lab{font:600 13px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.ph-card h1{font:500 24px/1.2 var(--f-d);letter-spacing:-.015em;margin:0;text-wrap:balance}
.ph-card .hint{font-size:15px;color:var(--mute);margin:-6px 0 0}
.ph-opts{display:flex;flex-direction:column;gap:9px}
.ph-opts button{min-height:56px;text-align:left;padding:12px 16px;border:1.5px solid var(--line);background:var(--bg);font:500 17px/1.25 var(--f-b);border-radius:2px;display:flex;gap:12px;align-items:center}
.ph-opts button::before{content:"";width:18px;height:18px;border:2px solid var(--dim);flex:none;border-radius:50%}
.ph-opts.multi button::before{border-radius:2px}
.ph-opts button.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--bg))}
.ph-opts button.sel::before{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--bg)}
.ph-text{min-height:56px;width:100%;padding:12px 16px;border:1.5px solid var(--line);background:var(--bg);font:500 19px/1.2 var(--f-b);border-radius:2px}
.ph-text:focus{border-color:var(--acc);outline:none}
.ph-send{min-height:58px;border:0;background:var(--acc);color:var(--acc-ink);font:800 17px/1 var(--f-d);letter-spacing:.01em;border-radius:2px}
.ph-send:disabled{background:var(--line);color:var(--dim);cursor:default}
.ph-next{min-height:54px;border:1.5px solid var(--fg);background:transparent;font:500 16px/1 var(--f-d);border-radius:2px}
.ph-ok{display:flex;gap:14px;align-items:center;font:500 20px/1.2 var(--f-d)}
.ph-ok i{width:38px;height:38px;border-radius:50%;background:var(--acc);flex:none;position:relative;animation:pop .5s var(--ease)}
.ph-ok i::after{content:"";position:absolute;left:13px;top:8px;width:9px;height:16px;border:solid var(--acc-ink);border-width:0 3.5px 3.5px 0;transform:rotate(42deg)}
.ph-ok.wait i{background:var(--dim);animation:blink 1s steps(2) infinite} .ph-ok.wait i::after{display:none}
@keyframes pop{from{transform:scale(.3)}}
.ph-said{font-size:16px;color:var(--mute);margin:0;overflow-wrap:anywhere}
.ph-said b{color:var(--fg);font-weight:500}
.ph-err{color:var(--hot);font-size:15px;margin:0}
.ph-pill{position:sticky;bottom:14px;align-self:center;border:0;background:var(--hot);color:#1b0a03;font:700 15px/1 var(--f-b);padding:13px 20px;border-radius:40px}
.ph-foot{margin-top:auto;font:400 12px/1.4 var(--f-m);color:var(--dim);letter-spacing:.06em;text-align:center}

@media (prefers-reduced-motion:reduce){
  .slide,.slide.on,.rise,.w,.bar .t i,.cloud span,#qr,.knob .needle{transition-duration:.01s!important;transition-delay:0s!important}
  .eq i,.ring::before,.ring::after,.ph-card{animation:none}
}
:root[data-calm] .slide,:root[data-calm] .slide.on{transform:none;filter:none;transition:opacity .3s ease,visibility 0s}
:root[data-calm] .w,:root[data-calm] .rise{filter:none;transform:none;transition:opacity .3s ease;transition-delay:.1s!important}
</style>
</head>
<body>
<canvas id="bg" hidden></canvas>

<div id="deck" hidden data-qr="off">
  <div id="stage">
    <div id="hud">
      <div class="hl-l">
        <svg class="knob" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="17" fill="none" stroke="var(--mute)" stroke-width="2"/>
          <g id="knobDots"></g>
          <line class="needle" x1="32" y1="32" x2="32" y2="18" stroke="var(--acc)" stroke-width="3.5" stroke-linecap="square"/>
        </svg>
        <span id="hudDial">Five Dials</span>
      </div>
      <div class="hl-r">
        <span id="hudDemo" hidden>Demo data</span>
        <span id="hudHint"></span>
        <span id="hudTime" hidden>00:00</span>
        <span><i class="dot-s" id="hudDot"></i><span id="hudPhones">0 phones</span></span>
      </div>
    </div>
    <div id="qr"><div id="qrSvg"></div><div class="cap"><span id="qrCap">Scan to answer</span><small id="qrSub">No app. No login.</small></div></div>
  </div>
  <div id="panel" hidden></div>
</div>

<div id="phone" hidden>
  <header class="ph-top"><span class="ph-brand">FIVE DIALS</span><span class="ph-live" id="phLive" hidden>Following the screen</span></header>
  <nav class="ph-steps" id="phSteps" aria-label="Polls"></nav>
  <main id="phMain"></main>
  <footer class="ph-foot">No names. No login. Answers show up on the big screen.</footer>
</div>

<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';

const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const LOCAL = !/^https?:$/.test(location.protocol) || /^(localhost|127\.|\[::1\])/.test(location.hostname);
function cleanFb(u) {
  u = String(u || '').trim().replace(/\/+$/, '');
  if (!u) return '';
  try {
    const x = new URL(u);
    const okHost = /(\.firebaseio\.com|\.firebasedatabase\.app)$/.test(x.hostname) || (LOCAL && /^(localhost|127\.0\.0\.1)$/.test(x.hostname));
    if (!okHost || (x.protocol !== 'https:' && !LOCAL)) return '';
    return x.origin + x.pathname.replace(/\/+$/, '');
  } catch { return ''; }
}
const JUNK = new RegExp('[' + [[0, 31], [127, 127], [0x200b, 0x200f], [0x2028, 0x202f], [0xfeff, 0xfeff]].map(([a, b]) => '\\u' + a.toString(16).padStart(4, '0') + '-\\u' + b.toString(16).padStart(4, '0')).join('') + ']', 'g');
const normText = s => String(s).replace(JUNK, ' ').replace(/\s+/g, ' ').trim().toLowerCase();

/* an answer is {d: device, p: poll id, v: string}. v is an option index, a comma list of indexes, or text */
function checkAnswer(a) {
  if (!a || typeof a !== 'object') return null;
  const d = String(a.d || ''), p = String(a.p || ''); let v = a.v;
  if (!/^[a-z0-9]{6,16}$/.test(d) || !Object.hasOwn(POLLS, p) || (typeof v !== 'string' && typeof v !== 'number')) return null;
  v = String(v); const P = POLLS[p];
  if (P.type === 'cloud') { v = normText(v).slice(0, P.max || 32); if (!v) return null; }
  else {
    const ix = [...new Set(v.split(',').map(Number))];
    if (!ix.length || ix.some(i => !Number.isInteger(i) || i < 0 || i >= P.opts.length)) return null;
    if (P.type === 'single' && ix.length !== 1) return null;
    v = ix.sort((x, y) => x - y).join(',');
  }
  const t = Number(a.t) > 1e12 ? Number(a.t) : Date.now();
  return { d, p, v, t };
}

/* ================= transport: phones -> deck ================= */
function makeTransport(fb, room) {
  if (fb) {
    const base = `${fb}/rooms/${room}`;
    return {
      kind: 'Firebase', sync: true,
      send: a => fetch(`${base}/a/${a.d}/${a.p}.json`, { method: 'PUT', body: JSON.stringify({ v: a.v, t: Date.now() }) }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); }),
      listen(on, status) {
        let stop = false, timer;
        const tick = async () => {
          try {
            const r = await fetch(`${base}/a.json`, { cache: 'no-store' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const j = (await r.json()) || {};
            for (const d in j) for (const p in (j[d] || {})) { const x = j[d][p]; if (x) on({ d, p, v: x.v, t: x.t }); }
            status(true);
          } catch { status(false); }
          if (!stop) timer = setTimeout(tick, 2000);
        };
        tick();
        return () => { stop = true; clearTimeout(timer); };
      },
      setState: s => fetch(`${base}/s.json`, { method: 'PUT', body: JSON.stringify(s) }).catch(() => {}),
      watchState(on) {
        let stop = false, timer;
        const tick = async () => {
          try { const r = await fetch(`${base}/s.json`, { cache: 'no-store' }); if (r.ok) on(await r.json()); } catch {}
          if (!stop) timer = setTimeout(tick, 3000);
        };
        tick();
        return () => { stop = true; clearTimeout(timer); };
      },
    };
  }
  const url = `${CONFIG.relayServer}/fivedials-${room}`;
  return {
    kind: 'Relay', sync: false,
    send: a => fetch(url, { method: 'POST', body: JSON.stringify({ d: a.d, p: a.p, v: a.v }) }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); }),
    listen(on, status) {
      let stop = false, es = null, live = false, timer, lastOk = 0;
      const take = m => { try { if (m && m.event === 'message') { const a = JSON.parse(m.message); a.t = m.time * 1000; on(a); } } catch {} };
      // history, and a safety net when the live stream is blocked
      const sweep = async () => {
        try {
          const r = await fetch(`${url}/json?poll=1&since=all`, { cache: 'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          (await r.text()).split('\n').forEach(l => { if (l.trim()) { try { take(JSON.parse(l)); } catch {} } });
          lastOk = Date.now(); status(true);
        } catch { if (!live) status(false); }
        if (!stop) timer = setTimeout(sweep, live ? 30000 : 8000);
      };
      try {
        es = new EventSource(`${url}/sse`);
        es.onopen = () => { live = true; status(true); };
        es.onmessage = e => { live = true; try { take(JSON.parse(e.data)); } catch {} };
        es.onerror = () => { live = false; if (Date.now() - lastOk > 20000) status(false); };
      } catch {}
      sweep();
      return () => { stop = true; clearTimeout(timer); if (es) es.close(); };
    },
    setState() {}, watchState() { return () => {}; },
  };
}

/* ================= boot: phone or deck ================= */
const jm = location.hash.match(/^#j\.([a-z0-9]{4,12})(?:\.([\w-]+))?$/);
if (jm) startPhone(jm[1], cleanFb(b64d(jm[2] || '')) || cleanFb(CONFIG.firebaseUrl));
else startDeck();

/* ================================================================
   PHONE
   ================================================================ */
function startPhone(room, fb) {
  document.body.classList.add('is-phone');
  $('#phone').hidden = false;
  const T = makeTransport(fb, room);
  const KEY = 'fd:ph:' + room;
  const st = ls.get(KEY, null) || { dev: rid(10), sent: {} };
  const save = () => ls.set(KEY, st);
  save();
  let cur = ORDER.findIndex(p => !st.sent[p]);
  if (cur < 0) cur = ORDER.length - 1;
  let livePoll = null, draft = {}, touched = false;
  const main = $('#phMain'), steps = $('#phSteps');

  function sayOf(p, v) {
    const P = POLLS[p];
    return P.type === 'cloud' ? v : v.split(',').map(i => P.opts[+i]).join(', ');
  }
  async function flush(p, tries = 0) {
    const s = st.sent[p]; if (!s || s.ok) return;
    try { await T.send({ d: st.dev, p, v: s.v }); s.ok = true; s.err = false; save(); }
    catch { s.err = tries >= 5; save(); if (tries < 5) setTimeout(() => flush(p, tries + 1), 1500 * (tries + 1)); }
    if (ORDER[cur] === p) render();
  }
  function submit(p, v) {
    st.sent[p] = { v, ok: false }; save(); touched = false; delete draft[p];
    render(); flush(p);
  }
  function goTo(i) { cur = Math.max(0, Math.min(ORDER.length - 1, i)); touched = false; render(); scrollTo({ top: 0 }); }

  function render() {
    const p = ORDER[cur], P = POLLS[p], s = st.sent[p];
    steps.replaceChildren(...ORDER.map((id, i) => h('button', {
      class: (st.sent[id] ? 'done ' : '') + (i === cur ? 'cur' : ''), text: LABEL[id],
      'aria-label': 'Poll ' + LABEL[id], 'aria-current': i === cur ? 'step' : null, onclick: () => goTo(i),
    })));
    const card = h('section', { class: 'ph-card' }, h('div', { class: 'lab', text: 'Poll ' + LABEL[p] }), h('h1', { text: P.q }));
    if (s) {
      add(card, 
        h('div', { class: 'ph-ok' + (s.ok ? '' : ' wait') }, h('i'), s.ok ? 'Sent. Look up.' : (s.err ? 'Not sent yet' : 'Sending…')),
        h('p', { class: 'ph-said' }, 'You said: ', h('b', { text: sayOf(p, s.v) })),
        s.err && h('p', { class: 'ph-err', text: 'The network dropped it. Your answer is saved on this phone.' }),
        s.err && h('button', { class: 'ph-next', text: 'Try again', onclick: () => { s.err = false; render(); flush(p); } }),
        cur < ORDER.length - 1
          ? h('button', { class: 'ph-next', text: 'Next question', onclick: () => goTo(cur + 1) })
          : h('p', { class: 'ph-said', text: 'That was the last one. Thank you.' }),
      );
    } else if (P.type === 'cloud') {
      const send = h('button', { class: 'ph-send', text: 'Send', disabled: true });
      const inp = h('input', { class: 'ph-text', id: 'phText', type: 'text', maxlength: P.max, placeholder: 'Type here', autocomplete: 'off', autocapitalize: 'none', enterkeyhint: 'send', 'aria-label': P.q });
      inp.value = draft[p] || '';
      const upd = () => { draft[p] = inp.value; touched = !!inp.value.trim(); send.disabled = !normText(inp.value); };
      inp.addEventListener('input', upd); upd();
      const go = () => { const v = normText(inp.value).slice(0, P.max); if (v) submit(p, v); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      send.addEventListener('click', go);
      add(card, P.hint && h('p', { class: 'hint', text: P.hint }), inp, send);
    } else {
      const multi = P.type === 'multi';
      const sel = new Set(draft[p] || []);
      const send = h('button', { class: 'ph-send', text: 'Send', disabled: !sel.size });
      const box = h('div', { class: 'ph-opts' + (multi ? ' multi' : ''), role: multi ? 'group' : 'radiogroup' });
      P.opts.forEach((o, i) => {
        const b = h('button', { text: o, class: sel.has(i) ? 'sel' : '', role: multi ? 'checkbox' : 'radio', 'aria-checked': String(sel.has(i)) });
        b.addEventListener('click', () => {
          if (multi) { sel.has(i) ? sel.delete(i) : sel.add(i); } else { sel.clear(); sel.add(i); }
          draft[p] = [...sel]; touched = sel.size > 0;
          [...box.children].forEach((c, j) => { c.classList.toggle('sel', sel.has(j)); c.setAttribute('aria-checked', String(sel.has(j))); });
          send.disabled = !sel.size;
        });
        box.append(b);
      });
      send.addEventListener('click', () => { if (sel.size) submit(p, [...sel].sort((a, b) => a - b).join(',')); });
      add(card, P.hint && h('p', { class: 'hint', text: P.hint }), box, send);
    }
    const kids = [card];
    if (livePoll && livePoll !== p && !st.sent[livePoll]) kids.push(h('button', { class: 'ph-pill', text: 'Go to the live question (' + LABEL[livePoll] + ')', onclick: () => goTo(ORDER.indexOf(livePoll)) }));
    main.replaceChildren(...kids);
  }

  if (T.sync) {
    $('#phLive').hidden = false;
    T.watchState(s => {
      const lp = s && Object.hasOwn(POLLS, s.p) ? s.p : null;
      if (lp === livePoll) return;
      livePoll = lp;
      if (lp && lp !== ORDER[cur] && !touched) goTo(ORDER.indexOf(lp)); else render();
    });
  }
  ORDER.forEach(p => { if (st.sent[p] && !st.sent[p].ok) flush(p); });
  render();
}

/* ================================================================
   DECK
   ================================================================ */
function startDeck() {
  document.body.classList.add('is-deck');
  const deck = $('#deck'), stage = $('#stage');
  deck.hidden = false; $('#bg').hidden = false;
  const root = document.documentElement;

  /* ---- session ---- */
  const cfg = Object.assign({ room: rid(7), fb: cleanFb(CONFIG.firebaseUrl), bright: false, hidden: [] }, ls.get('fd:cfg', {}));
  cfg.fb = cleanFb(cfg.fb);
  const saveCfg = () => ls.set('fd:cfg', cfg);
  saveCfg();
  if (cfg.bright) root.dataset.room = 'bright';
  const hiddenWords = new Set(cfg.hidden);
  const joinUrl = () => location.href.split('#')[0] + '#j.' + cfg.room + (cfg.fb ? '.' + b64e(cfg.fb) : '');

  /* ---- answers ---- */
  const store = new Map();            // "device|poll" -> {d,p,v,t,demo}
  let demoOn = false, connected = false, dirty = false;
  const firstSeen = new Map();
  (ls.get('fd:a:' + cfg.room, []) || []).forEach(a => { const c = checkAnswer(a); if (c) store.set(c.d + '|' + c.p, c); });
  setInterval(() => { if (dirty) { dirty = false; ls.set('fd:a:' + cfg.room, [...store.values()].filter(a => !a.demo)); } }, 1500);

  function ingest(raw, demo) {
    const a = checkAnswer(raw); if (!a) return;
    const k = a.d + '|' + a.p, old = store.get(k);
    if (old && old.v === a.v) return;
    if (store.size > 6000) return;
    if (old) a.t = old.t;
    if (demo) a.demo = true; else dirty = true;
    store.set(k, a);
    if (POLLS[a.p].type === 'cloud') { const fk = a.p + '|' + a.v; if (!firstSeen.has(fk)) { firstSeen.set(fk, performance.now()); setTimeout(() => scheduleRefresh(), 2700); } }
    onAnswer(a.p);
  }
  const rowsOf = pid => [...store.values()].filter(a => a.p === pid && (demoOn || !a.demo));
  function tally(pid) {
    const P = POLLS[pid], rows = rowsOf(pid);
    if (P.type === 'cloud') {
      const m = new Map();
      for (const a of rows) { const e = m.get(a.v) || { text: a.v, c: 0, t: a.t }; e.c++; e.t = Math.min(e.t, a.t); m.set(a.v, e); }
      const all = [...m.values()].sort((a, b) => b.c - a.c || a.t - b.t);
      return { n: rows.length, all, items: all.filter(e => !hiddenWords.has(pid + '|' + e.text)) };
    }
    const c = P.opts.map(() => 0);
    for (const a of rows) for (const i of a.v.split(',')) c[+i]++;
    return { n: rows.length, c };
  }
  const phones = () => new Set([...store.values()].filter(a => demoOn || !a.demo).map(a => a.d)).size;

  let transport = null, stopListen = null;
  function connect() {
    if (stopListen) stopListen();
    transport = makeTransport(cfg.fb, cfg.room);
    connected = false;
    stopListen = transport.listen(a => ingest(a, false), ok => { connected = ok; hud(); });
  }

  /* ---- background field ---- */
  const BG = (() => {
    const cv = $('#bg'), g = cv.getContext('2d');
    const N = 1500, P = [], pings = [];
    let W = 0, H = 0, R = 0, cx = 0, cy = 0, warp = 0, dir = 1, level = 1, want = 1, last = performance.now(), gridOff = 0, formed = null;
    let acc = [25, 200, 245], hot = [255, 138, 91], bg = '#04070D', light = false;
    const hex = s => { s = s.trim().replace('#', ''); return [0, 2, 4].map(i => parseInt(s.slice(i, i + 2), 16)); };
    const calm = () => root.hasAttribute('data-calm');
    function theme() {
      const cs = getComputedStyle(root);
      acc = hex(cs.getPropertyValue('--acc')); hot = hex(cs.getPropertyValue('--hot')); bg = cs.getPropertyValue('--bg').trim();
      light = root.dataset.room === 'bright';
    }
    function seed(p, anywhere) {
      p.a = Math.random() * 6.2832; p.r = anywhere ? Math.pow(Math.random(), .7) : .015 + Math.random() * .07;
      p.v = .15 + Math.random() * .85; p.s = Math.random();
      p.x = p.ox = cx + Math.cos(p.a) * p.r * R; p.y = p.oy = cy + Math.sin(p.a) * p.r * R; p.tx = null;
    }
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 1.5);
      W = innerWidth; H = innerHeight; cv.width = W * dpr | 0; cv.height = H * dpr | 0; g.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = W / 2; cy = H * .46; R = Math.hypot(W, H) / 2;
    }
    function grid(dt) {
      const y0 = H * .6, a = (light ? .3 : .26) * level;
      gridOff = (gridOff + dt * (.22 + warp * 2.4) * dir + 1) % 1;
      g.lineWidth = 1;
      for (let i = -16; i <= 16; i++) {
        g.strokeStyle = `rgba(${acc},${a * .55})`;
        g.beginPath(); g.moveTo(cx + i * W * .012, y0); g.lineTo(cx + i * W * .17, H); g.stroke();
      }
      for (let k = 0; k < 14; k++) {
        const z = (k + gridOff) / 14, y = y0 + (H - y0) * z * z;
        g.strokeStyle = `rgba(${acc},${a * z})`;
        g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
      }
      const gr = g.createLinearGradient(0, y0 - 60, 0, y0 + 30);
      gr.addColorStop(0, `rgba(${acc},0)`); gr.addColorStop(.75, `rgba(${acc},${.16 * level})`); gr.addColorStop(1, `rgba(${acc},0)`);
      g.fillStyle = gr; g.fillRect(0, y0 - 60, W, 90);
    }
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      warp *= Math.pow(.012, dt); level += (want - level) * Math.min(1, dt * 3);
      g.globalCompositeOperation = 'source-over'; g.fillStyle = bg; g.fillRect(0, 0, W, H);
      grid(dt);
      g.globalCompositeOperation = light ? 'source-over' : 'lighter';
      const streak = warp > .06, sp = (.05 + warp * 2.8) * dir;
      g.lineCap = 'butt';
      for (const p of P) {
        p.ox = p.x; p.oy = p.y;
        let al, sz;
        if (p.tx != null) {
          const k = Math.min(1, dt * (2.4 + p.s * 4.2));
          p.x += (p.tx - p.x) * k + (Math.random() - .5) * .7; p.y += (p.ty - p.y) * k + (Math.random() - .5) * .7;
          al = (light ? 1 : .9) * (.6 + .4 * p.s); sz = 2.2 + p.s * 1.9;
        } else {
          p.r += (.03 + p.r * .5) * p.v * sp * dt * 3;
          if (p.r > 1.06) seed(p, false); else if (p.r < .012) { seed(p, false); p.r = 1.02; }
          p.x = cx + Math.cos(p.a) * p.r * R; p.y = cy + Math.sin(p.a) * p.r * R;
          al = Math.min(1, p.r * 2) * level * (.3 + .7 * p.s) * (light ? .8 : 1); sz = .7 + p.r * 2.6;
        }
        if (streak && p.tx == null && Math.abs(p.x - p.ox) + Math.abs(p.y - p.oy) < R * .4) {
          g.strokeStyle = `rgba(${acc},${al})`; g.lineWidth = sz * .8;
          g.beginPath(); g.moveTo(p.ox, p.oy); g.lineTo(p.x, p.y); g.stroke();
        } else { g.fillStyle = `rgba(${acc},${al})`; g.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz); }
      }
      for (let i = pings.length - 1; i >= 0; i--) {
        const q = pings[i]; q.t += dt / .9;
        if (q.t >= 1) { pings.splice(i, 1); continue; }
        const e = 1 - Math.pow(1 - q.t, 3), arc = Math.sin(q.t * Math.PI) * q.lift;
        const x = q.x0 + (q.x1 - q.x0) * e, y = q.y0 + (q.y1 - q.y0) * e - arc;
        const rg = g.createRadialGradient(x, y, 0, x, y, 26);
        rg.addColorStop(0, `rgba(${hot},.95)`); rg.addColorStop(1, `rgba(${hot},0)`);
        g.fillStyle = rg; g.fillRect(x - 26, y - 26, 52, 52);
        g.fillStyle = `rgba(${hot},1)`; g.fillRect(x - 3, y - 3, 6, 6);
      }
      requestAnimationFrame(frame);
    }
    function form(text, fsPx, cxp, baseY) {
      const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
      const o = oc.getContext('2d', { willReadFrequently: true });
      o.font = `800 ${fsPx}px Unbounded, "Arial Black", sans-serif`; o.textAlign = 'center'; o.textBaseline = 'alphabetic';
      try { o.letterSpacing = (-.01 * fsPx) + 'px'; } catch {}
      o.fillStyle = '#fff'; o.fillText(text, cxp, baseY);
      const data = o.getImageData(0, 0, W, H).data, cap = Math.floor(N * .86);
      let step = Math.max(3, Math.round(fsPx / 46)), pts;
      for (; ; step++) {
        pts = [];
        for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) if (data[(y * W + x) * 4 + 3] > 140) pts.push(x, y);
        if (pts.length / 2 <= cap) break;
      }
      const n = pts.length / 2, idx = Array.from({ length: n }, (_, i) => i);
      for (let i = n - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
      P.forEach((p, i) => { if (i < n) { p.tx = pts[idx[i] * 2]; p.ty = pts[idx[i] * 2 + 1]; } else p.tx = null; });
      formed = { text, fsPx, cxp, baseY };
    }
    function release() {
      if (!formed) return; formed = null;
      for (const p of P) if (p.tx != null) {
        p.tx = null; const dx = p.x - cx, dy = p.y - cy;
        p.a = Math.atan2(dy, dx); p.r = Math.max(.02, Math.hypot(dx, dy) / R);
      }
    }
    resize(); theme();
    for (let i = 0; i < N; i++) { const p = {}; seed(p, true); P.push(p); }
    requestAnimationFrame(frame);
    return {
      resize, theme, form, release,
      kick(d) { if (!calm()) { warp = 1; dir = d; } },
      level(v) { want = v; },
      ping(x0, y0, x1, y1) { if (pings.length < 40 && !calm()) pings.push({ x0, y0, x1, y1, t: 0, lift: 60 + Math.random() * 120 }); },
      get formed() { return formed; },
    };
  })();

  /* ---- slides ---- */
  const S = [];
  S.push({ k: 'title' }, { k: 'hands' });
  DIALS.forEach((d, i) => {
    S.push({ k: 'chapter', d: i }, { k: 'poll', d: i, p: d.poll }, { k: 'results', d: i, p: d.poll, down: !!d.bonus });
    if (d.bonus) S.push({ k: 'poll', d: i, p: d.bonus, bonus: true }, { k: 'results', d: i, p: d.bonus, bonus: true });
    S.push({ k: 'story', d: i }, { k: 'insight', d: i }, { k: 'try', d: i });
  });
  S.push({ k: 'recap' }, { k: 'poll', p: 'p6' }, { k: 'results', p: 'p6' }, { k: 'final' });

  function words(str, start = 0) {
    const out = []; let i = start, hl = false;
    str.split('*').forEach(part => {
      part.split(/(\s+)/).forEach(tok => {
        if (!tok) return;
        if (/^\s+$/.test(tok)) out.push(' ');
        else out.push(h('span', { class: 'w' + (hl ? ' hl' : ''), style: `--i:${i++}`, text: tok }));
      });
      hl = !hl;
    });
    return out;
